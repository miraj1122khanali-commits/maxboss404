 @keyframes borderColors {

   50% { background-position: 100% 50%; }
   100% { background-position: 0% 50%; }
 }

 } 
 
 #login-page button {

   padding: 8px 24px;

   color: #000;

 } 
 
 #login-page button:hover {

 } 
 
 #hack-widget { 
   width: 100%; 
   height: 100%;

   align-items: center; 
   justify-content: space-around; 
   position: relative; 
   z-index: 5; 
 } 
 
 .user-title { 
   color: #FFD700; 
   font-size: 11px; 
   font-weight: 900; 
   letter-spacing: 0.5px; 
   text-align: center; 
   font-family: 'Rajdhani', sans-serif; 
   text-shadow: 0 0 8px #FFD700; 
   margin-top: 3px; 
 } 
 
 .period-box { 
   font-size: 10px; 
   color: #aaa; 
   font-family: 'Orbitron'; 
   background: rgba(0,0,0,0.6); 
   padding: 4px 8px; 
   border-radius: 6px; 
 } 
 
 .period-box span {

 } 
 
 .signal-text { 
   font-size: 26px; 
   font-weight: 900; 
   text-transform: uppercase; 
   text-align: center; 
   animation: floating 2s ease-in-out infinite; 
 } 
 
 .number-box { 
   font-size: 38px; 
   font-weight: 900; 
   font-family: 'Rajdhani';

 } 
 
 @keyframes floating { 
   0%, 100% { transform: translateY(0px); } 
   50% { transform: translateY(-3px); } 
 } 
 
 .timer-circle { 
   width: 44px; 
   height: 44px; 
   border: 2.5px solid #ff0000; 
   border-radius: 50%; 
   display: flex; 
   align-items: center;

 } 
 
 #error-overlay { 
   position: absolute; 
   top: 0; 
   left: 0; 
   width: 100%; 
   height: 100%; 
   background: #1a0000; 
   display: none; 
   z-index: 150; 
   color: #ff3333; 
   font-size: 9px; 
   padding: 15px; 
   box-sizing: border-box; 
   text-align: center;
 } 
 
 .crash-effect { 
   animation: shake 0.15s infinite !important; 
 } 
 
 @keyframes shake { 
   0% { transform: translate(1px, 1px); } 
   50% { transform: translate(-1px, -1px); } 
   100% { transform: translate(1px, -1px); } 
 } 
</style>

<body>

<div id="ui-wrapper">

          𝑴𝑬𝑯𝑬𝑫𝑰 𝑯𝑨𝑺𝑨𝑵 𝑺𝑯𝑨𝑾𝑶𝑵

<script> 
 const wrapper = document.getElementById("ui-wrapper"); 
 const loginPage = document.getElementById("login-page"); 
 const hackWidget = document.getElementById("hack-widget"); 
 const statusText = document.getElementById("status-text"); 
 const errorOverlay = document.getElementById("error-overlay"); 
 const periodDisplay = document.getElementById("period-display"); 
 const sig = document.getElementById("signal"); 
 const numDisp = document.getElementById("num-display"); 
 const timerCircle = document.getElementById("timer"); 
 
 let currentMode = '30s'; 
 const PATTERN_SEED = [ 
   {s: "BIG", n: 7}, {s: "SMALL", n: 2}, {s: "SMALL", n: 4}, 
   {s: "BIG", n: 9}, {s: "BIG", n: 6}, {s: "SMALL", n: 0}, 
   {s: "BIG", n: 8}, {s: "SMALL", n: 3}, {s: "SMALL", n: 1}, 
   {s: "BIG", n: 5}, {s: "BIG", n: 7}, {s: "SMALL", n: 4} 
 ]; 
 
 function generateHGZYPeriod() { 
   const now = new Date(); 
   const baseTimeUTC = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), 0, 0, 0); 
   const diffSeconds = Math.floor((Date.now() - baseTimeUTC) / 1000); 
   const interval = currentMode === '30s' ? 30 : 60; 
   const periodIndex = Math.floor(diffSeconds / interval) + 1; 
   const yyyy = now.getUTCFullYear(); 
   const mm = String(now.getUTCMonth() + 1).padStart(2, "0"); 
   const dd = String(now.getUTCDate()).padStart(2, "0"); 
   const datePart = `${yyyy}${mm}${dd}`; 
   const periodId = datePart + String(periodIndex).padStart(5, "0"); 
   const secondsLeft = interval - (diffSeconds % interval); 
   return { id: periodId, index: periodIndex, timeLeft: secondsLeft }; 
 } 
 
 function changeMode(mode) { 
   if (currentMode === mode) return; 
   currentMode = mode; 
   document.getElementById('btn-30s').classList.remove('active'); 
   document.getElementById('btn-1m').classList.remove('active'); 
   if(mode === '30s') { 
     document.getElementById('btn-30s').classList.add('active'); 
   } else { 
     document.getElementById('btn-1m').classList.add('active'); 
   } 
   update(true); 
 } 
 
 function checkLogin() { 
   if (document.getElementById("pass").value === "BOSS404") { 
     loginPage.style.display = "none"; 
     hackWidget.style.display = "flex"; 
     update(); 
     const vid = document.getElementById("panel-video"); 
     if(vid) vid.play().catch(e => console.log("Video auto-play bypass")); 
   } else { 
     statusText.innerText = "ACCESS DENIED!"; 
     statusText.style.color = "red"; 
     statusText.style.textShadow = "0 0 10px red"; 
     wrapper.classList.add("crash-effect"); 
     setTimeout(() => { 
       errorOverlay.style.display = "block"; 
       setTimeout(() => { 
         // নতুন টেলিগ্রাম চ্যানেল লিংক এখানে আপডেট করা হয়েছে
         window.location.href = "https://t.me/+-gOfsmtIcG03MDA1"; 
       }, 2000); 
     }, 1000); 
   } 
 } 
 
 let isDragging = false; 
 let offset = { x: 0, y: 0 }; 
 
 const start = (e) => { 
   if(e.target.classList.contains('mode-btn') || e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return; 
   isDragging = true; 
   const c = e.type.includes('touch') ? e.touches[0] : e; 
   offset.x = c.clientX - wrapper.offsetLeft; 
   offset.y = c.clientY - wrapper.offsetTop; 
   wrapper.style.transition = "none"; 
 }; 
 
 const move = (e) => { 
   if (!isDragging) return; 
   e.preventDefault(); 
   const c = e.type.includes('touch') ? e.touches[0] : e; 
   let x = c.clientX - offset.x; 
   let y = c.clientY - offset.y; 
   x = Math.max(0, Math.min(x, window.innerWidth - wrapper.offsetWidth)); 
   y = Math.max(0, Math.min(y, window.innerHeight - wrapper.offsetHeight)); 
   wrapper.style.left = x + "px"; 
   wrapper.style.top = y + "px"; 
 }; 
 
 const stop = () => { 
   isDragging = false; 
 }; 
 
 wrapper.addEventListener("mousedown", start); 
 window.addEventListener("mousemove", move); 
 window.addEventListener("mouseup", stop); 
 wrapper.addEventListener("touchstart", start, {passive: false}); 
 window.addEventListener("touchmove", move, {passive: false}); 
 window.addEventListener("touchend", stop); 
 
 function update(modeChanged = false) { 
   const p = generateHGZYPeriod(); 
   if (periodDisplay.innerText !== p.id || modeChanged) { 
     periodDisplay.innerText = p.id; 
   } 
   if (!sig || !numDisp || !timerCircle) return; 
   timerCircle.innerText = p.timeLeft; 
   const modeOffset = currentMode === '30s' ? 0 : 5; 
   const patternIndex = (p.index + modeOffset) % PATTERN_SEED.length; 
   const prediction = PATTERN_SEED[patternIndex]; 
   
   if (p.timeLeft <= 5) { 
     sig.innerText = "SYNCING"; 
     sig.style.color = "#FFD700"; 
     sig.style.textShadow = "0 0 15px #FFD700, 0 0 25px #ff7300"; 
     numDisp.innerText = "÷"; 
     numDisp.style.color = "#FFD700"; 
     numDisp.style.textShadow = "0 0 15px #FFD700"; 
     timerCircle.style.borderColor = "#FFD700"; 
   } else { 
     sig.innerText = prediction.s; 
     numDisp.innerText = prediction.n; 
     
     if (prediction.s === "BIG") { 
       sig.style.color = "#00ffff"; 
       sig.style.textShadow = "0 0 20px #00ffff, 0 0 30px #00ff00"; 
       numDisp.style.color = "#00ffff"; 
       numDisp.style.textShadow = "0 0 20px #00ffff, 0 0 30px #00ff00"; 
       timerCircle.style.borderColor = "#00ffff"; 
     } else { 
       sig.style.color = "#ff3300"; 
       sig.style.textShadow = "0 0 20px #ff3300, 0 0 30px #ff0000"; 
       numDisp.style.color = "#ff3300"; 
       numDisp.style.textShadow = "0 0 20px #ff3300, 0 0 30px #ff0000"; 
       timerCircle.style.borderColor = "#ff3300"; 
     } 
   } 
 } 
 setInterval(() => update(false), 1000); 
 update(true); 
</script>
